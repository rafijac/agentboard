<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentBoard — The IDE Replacement (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--panel:#121318;--card:#171920;--card2:#1d2029;--line:#262a35;--txt:#e6e8ee;--mut:#8a90a2;--acc:#7c6cff;--acc2:#4fd1c5;--ok:#3ecf8e;--warn:#f5b84a;--bad:#f2555a;--r:10px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;display:flex;gap:8px;align-items:center}.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:inline-block}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--mut);padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}.tabs button.on{background:var(--card2);color:var(--txt)}
.demo{font-size:11px;padding:3px 8px;border-radius:99px;background:#f5b84a22;color:var(--warn);border:1px solid #f5b84a55}
.sp{flex:1}.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}.btn:hover{border-color:#3a3f4d}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:#3ecf8e22;border-color:var(--ok);color:var(--ok)}.btn.bad{background:#f2555a22;border-color:var(--bad);color:var(--bad)}
main{flex:1;overflow:hidden;position:relative}
.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px;padding:18px;height:100%;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.col h3{margin:0;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.col h3 .dot{width:8px;height:8px;border-radius:50%}.col h3 .n{color:var(--mut);font-weight:500;margin-left:auto}
.list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.list.over{background:#7c6cff10;outline:1px dashed var(--acc);outline-offset:-6px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:grab;transition:border-color .15s,transform .15s}.card:hover{border-color:#3a3f4d;transform:translateY(-1px)}
.card.drag{opacity:.4}.card .t{font-weight:600;margin-bottom:6px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:9px 0 7px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #3ecf8e88;animation:p 1.6s infinite}@keyframes p{70%{box-shadow:0 0 0 7px #3ecf8e00}100%{box-shadow:0 0 0 0 #3ecf8e00}}
.side{position:fixed;top:0;right:0;width:min(560px,100%);height:100vh;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:20;display:flex;flex-direction:column;box-shadow:-20px 0 40px #0008}
.side.open{transform:none}.side .hd{padding:16px 18px;border-bottom:1px solid var(--line)}.side .bd{flex:1;overflow-y:auto;padding:16px 18px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 0 8px}
.log{background:#08090b;border:1px solid var(--line);border-radius:8px;padding:10px;height:220px;overflow-y:auto;font-size:12px}.log div{white-space:pre-wrap}.log .ts{color:#555c6e}
.diff{background:#08090b;border:1px solid var(--line);border-radius:8px;font-size:12px}.diff div{padding:5px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.add{color:var(--ok)}.del{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.kv span{display:block;font-size:11px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30}.modal.open{display:flex}
.modal form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,92%);display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font:inherit}
.dash{padding:18px;overflow-y:auto;height:100%;display:none}.dash.on{display:block;flex:1;min-height:0}
.brain{padding:18px;overflow-y:auto;height:100%;display:none;max-width:880px;margin:0 auto;width:100%}
.brain.on{display:block}
.brain img{width:100%;border-radius:12px;border:1px solid var(--line)}
.mem{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi span{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:26px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.panel h4{margin:0 0 10px;font-size:13px}
.util{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}.util .bar{flex:1;margin:0;height:8px}.util .nm{width:150px}
.feed div{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--mut)}.feed b{color:var(--txt);font-weight:500}
.board{grid-template-columns:repeat(3,1fr)!important;height:auto!important;flex:1;min-height:0}main{display:flex;flex-direction:column}.closed{flex:none;max-height:35vh;overflow:auto}.closed{margin:0 20px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.closed summary{cursor:pointer;font-size:13px;font-weight:600}.closed .cl{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}.mini{font-size:11px;padding:3px 8px}
.foot{font-size:11px;color:var(--mut);padding:6px 20px;border-top:1px solid var(--line);background:var(--panel)}
.tabs button .bdg{display:inline-block;min-width:18px;text-align:center;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 5px;margin-left:6px;font-weight:600}
.inbox{padding:18px;overflow-y:auto;height:100%;display:none;flex-direction:column;gap:12px;max-width:880px;margin:0 auto;width:100%}
.inbox.on{display:flex}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.icard h3{margin:8px 0 4px;font-size:15px}
.icard .sub{font-size:12px;color:var(--mut);margin-bottom:6px}
.isum{font-size:13.5px;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.irow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.orig{display:none;margin-top:10px}.orig.open{display:block}
.origbtn{background:none;border:0;color:var(--acc);cursor:pointer;font-size:12px;padding:0}
.empty{color:var(--mut);text-align:center;padding:60px 20px;font-size:14px}
.empty .big{font-size:40px;display:block;margin-bottom:12px}
.qbox{margin-top:12px;background:#7c6cff0d;border:1px solid #7c6cff44;border-radius:10px;padding:12px 14px}
.qhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#a99cff;font-weight:600;margin-bottom:5px}
.qtext{font-size:13.5px}
.qrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qchip{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:12.5px}
.qchip:hover{border-color:var(--acc)}
</style></head><body>
<header><div class="logo"><i></i>AgentBoard</div><div class="tabs"><button data-tab="inbox" class="on">Inbox<span class="bdg" id="inboxBdg" style="display:none"></span></button><button data-tab="board">Board</button><button data-tab="dash">Dashboard</button><button data-tab="brain">Brain</button></div>
<span class="demo">DEMO · simulated data</span><div class="sp"></div>
<label style="flex-direction:row;align-items:center;gap:6px">Sim speed <select id="speed"><option value="1">1×</option><option value="3" selected>3×</option><option value="8">8×</option></select></label>
<button class="btn" id="reset">Reset demo</button><button class="btn p" id="new">+ New task</button></header>
<main><div class="board" id="board" style="display:none"></div><div class="inbox on" id="inbox"></div><div class="dash" id="dash"></div><div class="brain" id="brain"></div><details class="closed" id="closed" style="display:none"></details></main>
<div class="foot">Portfolio demo by Rafi Jacobson · all agents, repos, logs, tokens and costs are simulated in-browser · state saved to localStorage</div>
<aside class="side" id="side"></aside>
<div class="modal" id="modal"><form id="form"><h3 style="margin:0">New agent task</h3>
<label>Title<input name="title" required placeholder="Add rate limiting to /api/search"></label>
<label>Agent<select name="agent"></select></label>
<div class="row" style="flex-wrap:nowrap"><label style="flex:1">Repo<input name="repo" value="acme/web-app"></label><label style="flex:1">Branch<input name="branch" placeholder="auto"></label></div>
<label>Instructions<textarea name="desc" rows="3" placeholder="What should the agent do?"></textarea></label>
<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="start" checked> Start agent immediately</label>
<div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn p">Create</button></div></form></div>
<script>
const COLS=[["done","Done","#3ecf8e"],["review","Needs you","#f5b84a"],["running","Running","#7c6cff"]];
const AGENTS=[{n:"Atlas",m:"sim-large-v2",c:12},{n:"Nova",m:"sim-fast-mini",c:2},{n:"Orion",m:"sim-reasoner-x",c:20},{n:"Vega",m:"sim-code-pro",c:8}];
const STEPS=["Reading repository structure","Indexing relevant files","Planning changes","Editing source files","Writing unit tests","Running test suite","Fixing failing test","Running linter","Summarizing diff"];
const FILES=["src/api/search.ts","src/lib/cache.ts","src/components/Table.tsx","tests/search.test.ts","src/utils/retry.ts","src/db/migrations/042.sql","README.md","src/hooks/useAgents.ts"];
const KEY="agentboard-demo-v4";let S,sel=null;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mk(title,ai,col,repo="acme/web-app",desc="",kind="orch",parent=null){const a=AGENTS[ai];const t={id:uid(),title,agent:a.n,model:a.m,repo,branch:"agent/"+title.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,28),col,progress:0,tokens:0,elapsed:0,log:[],diff:[],desc,created:Date.now(),result:null,kind,parent,inbox:null,touched:false};
 if(col!=="backlog")fast(t,col);else{t.col="running";t.queued=true}return t}
function fast(t,col){const p=col==="running"?rnd(10,60):100;while(t.progress<p)tick(t,1,true);if(col!=="running"){t.progress=100;finish(t,true)}t.col=col;if(col==="done"){t.result="approved";t.doneAt=Date.now()-rnd(1,48)*36e5}}
function seed(){S={tasks:[],events:[],hist:[],intercepted:3};
 const O=(title,ai,repo)=>{const t=mk(title,ai,"running",repo,"","orch");S.tasks.push(t);return t};
 const W=(title,ai,parent,repo)=>{const t=mk(title,ai,"running",repo||parent.repo,"","worker",parent.id);S.tasks.push(t);return t};
 const o1=O("Checkout flow revamp",0,"acme/storefront"),o2=O("API hardening sprint",3,"acme/web-app"),o3=O("Design system tokens",1,"acme/ui-kit");
 W("Generate e2e tests for checkout",0,o1);W("Migrate auth to OAuth PKCE flow",2,o1,"acme/identity");
 const r1=W("Fix N+1 query in orders endpoint",2,o1);r1.progress=100;finish(r1,true,true);
 W("Refactor retry logic with jitter",3,o2);
 const r2=W("Add rate limiting to /api/search",3,o2);r2.progress=100;finish(r2,true,true);
 W("Add OpenTelemetry tracing",0,o2,"acme/platform");
 W("Add dark-mode tokens to design system",1,o3);W("Upgrade to Node 22 + fix deprecations",1,o3);W("Virtualize large data table",3,o3);
 [["Add dark-mode tokens to design system","approved",5],["Upgrade to Node 22 + fix deprecations","rejected",9],["Add OpenTelemetry tracing","approved",30],["Virtualize large data table","approved",2]].forEach(([ti,res,h])=>{const t=S.tasks.find(x=>x.title===ti);t.col="done";t.result=res;t.progress=100;t.doneAt=Date.now()-h*36e5;if(!t.diff.length)t.diff.push({f:FILES[0],a:Math.round(rnd(10,60)),d:Math.round(rnd(0,20))})});
 save()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.tasks)seed()}
function cost(t){const a=AGENTS.find(a=>a.n===t.agent)||AGENTS[0];return t.tokens/1e6*a.c}
const fmtT=s=>{s=Math.round(s);return s<60?s+"s":Math.floor(s/60)+"m "+(s%60)+"s"},fmtK=n=>n>1e6?(n/1e6).toFixed(2)+"M":n>1e3?(n/1e3).toFixed(1)+"k":Math.round(n);
function addLog(t,msg,silent){t.log.push([new Date().toLocaleTimeString([],{hour12:false}),msg]);if(t.log.length>80)t.log.shift()}
function tick(t,dt,silent){t.elapsed+=dt*rnd(3,7);t.tokens+=dt*rnd(800,2600);const before=Math.floor(t.progress/100*STEPS.length);t.progress=Math.min(100,t.progress+dt*rnd(.6,2.2));const after=Math.floor(t.progress/100*STEPS.length);
 if(after>before||!t.log.length){const st=STEPS[Math.min(after,STEPS.length-1)];addLog(t,"▸ "+st);if(st.startsWith("Editing")){const f=FILES[Math.floor(Math.random()*FILES.length)];addLog(t,"  edit "+f);if(!t.diff.find(d=>d.f===f))t.diff.push({f,a:Math.round(rnd(4,90)),d:Math.round(rnd(0,40))})}if(st.startsWith("Running test"))addLog(t,"  "+Math.round(rnd(40,180))+" passed, "+(Math.random()<.3?1:0)+" failed")}
 else if(Math.random()<.25)addLog(t,"  tool_call: "+["read_file","grep","run_cmd","apply_patch"][Math.floor(Math.random()*4)])}
function intercept(t,forceEsc){t.touched=true;const host=t.kind==="worker"&&t.parent?S.tasks.find(x=>x.id===t.parent):t;
 if(!forceEsc&&Math.random()<0.45){t.col="done";t.result="approved";t.doneAt=Date.now();t.progress=100;addLog(t,"✦ Interceptor (cheap model) reviewed and merged — no human needed");S.intercepted=(S.intercepted||0)+1;ev(`✦ Interceptor handled “${esc(t.title)}”`);return true}
 const h=host||t,add=t.diff.reduce((s,d)=>s+d.a,0),del=t.diff.reduce((s,d)=>s+d.d,0),fails=(t.log.join(" ").match(/ failed/g)||[]).length,risk=add>200||fails?"medium":"low";
 const q=fails?{text:`${fails} test failure${fails>1?"s":""} — merge anyway, or re-run the agent?`,replies:[["Merge anyway","approve"],["Re-run agent","reject"],["Show me the failure","orig"]]}:{text:`All green — ${add} additions across ${t.diff.length} file${t.diff.length>1?"s":""}. Approve and merge?`,replies:[["Approve & merge","approve"],["Review the diff first","board"]]};
 h.inbox={by:t.id,unread:true,summary:`<b>${t.agent}</b> finished <b>“${esc(t.title)}”</b>: ${t.diff.length} files changed (${add} additions). ${fails?`<b>${fails} test failure${fails>1?"s":""}</b> — needs your eyes before merge.`:`All green in the sim — ready for sign-off.`}`,chips:[`${t.diff.length} files`,`+${add}/−${del}`,fails?fails+" failed":"tests passed","risk: "+risk,fmtK(t.tokens)+" tok","$"+cost(t).toFixed(2),"⏱ "+fmtT(t.elapsed)],suggestion:fails?"Review the failures, then decide":"Safe to approve",q};
 addLog(t,"✦ Interceptor summarized this for your inbox");ev(`✦ “${esc(t.title)}” summarized → inbox`);return false}
function finish(t,silent,forceEsc){if(!t.diff.length)t.diff.push({f:FILES[0],a:24,d:6},{f:FILES[3],a:41,d:0});addLog(t,"✓ Agent finished — awaiting review");
 if(intercept(t,forceEsc)){if(!silent)ev(`<b>${t.agent}</b> finished “${esc(t.title)}” — handled, no review needed`)}
 else{t.col="review";if(!silent)ev(`<b>${t.agent}</b> finished “${esc(t.title)}” → inbox`)}}
function ev(h){S.events.unshift({h,at:Date.now()});S.events=S.events.slice(0,30)}
function loop(){const sp=+$("#speed").value;let ch=false;S.tasks.forEach(t=>{if(t.col==="running"&&!t.queued){tick(t,.5*sp);ch=true;if(t.progress>=100)finish(t)}});
 if(ch){save();render()}}
function render(){renderBoard();renderBdg();if($("#dash").classList.contains("on"))renderDash();if($("#inbox").classList.contains("on"))renderInbox();if($("#brain").classList.contains("on"))renderBrain();if(sel)renderSide()}
function renderBrain(){const done=S.tasks.filter(t=>t.col==="done").length;
 $("#brain").innerHTML=`<h2 style="margin:4px 0 6px;font-size:20px">The wiki brain</h2><p style="color:var(--mut);margin:0 0 14px">The executive assistant's memory — a living knowledge graph built from your past answers, decisions, and project context. Before anything reaches your inbox, the assistant checks the brain and tries to resolve the session itself. Only what it can't answer with confidence becomes an inbox item.</p>
 <img src="wiki-brain.png" alt="Wiki brain — the executive assistant's knowledge graph">
 <div class="sec">What the brain has learned from you (simulated)</div>
 <div class="mem"><span class="chip">✓ Merge when tests pass and diff &lt; 200 lines</span><span class="chip">✓ Never auto-merge auth or payments code</span><span class="chip">✓ You prefer small, reviewable PRs</span><span class="chip">✓ Re-run on flaky tests, don't merge</span><span class="chip">✓ Friday deploys need your eyes</span></div>
 <div class="kpis" style="margin-top:14px">${[["Sessions resolved by the brain",S.intercepted||0],["Decisions learned",5],["Needs you",inboxItems().length],["Sessions reviewed",done]].map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div>`}
function renderBoard(){$("#board").innerHTML=COLS.map(([k,l,c])=>{const ts=S.tasks.filter(t=>t.col===k&&!t.closed).sort((a,b)=>(b.queued?1:0)-(a.queued?1:0));return `<section class="col"><h3><span class="dot" style="background:${c}"></span>${l}<span class="n">${ts.length}</span></h3><div class="list" data-col="${k}">${ts.map(card).join("")}</div></section>`}).join("")+"";renderClosed()}
function inboxItems(){return S.tasks.filter(t=>t.inbox&&!t.closed)}
function renderBdg(){const n=inboxItems().filter(t=>t.inbox.unread).length,b=$("#inboxBdg");b.style.display=n?"":"none";b.textContent=n}
function openInbox(){inboxItems().forEach(t=>t.inbox.unread=false);save();renderBdg();renderInbox()}
function viewOnBoard(id){document.querySelector('.tabs button[data-tab="board"]').click();openSide(id)}
function renderInbox(){const items=inboxItems();
 $("#inbox").innerHTML=items.length?items.map(t=>{const ib=t.inbox,by=S.tasks.find(x=>x.id===ib.by),src=by||t;
  return `<div class="icard"><div class="row" style="justify-content:space-between"><span class="tag" style="color:var(--acc2)">✦ rewritten by interceptor · cheap model</span><span class="tag">${t.agent} · orchestrator</span></div>
  <h3>${esc(t.title)}</h3><div class="sub">${by&&by.id!==t.id?`via ${esc(by.agent)} · ${esc(by.title)} · `:""}${esc(t.repo)}</div>
  <div class="isum">${ib.summary}</div><div class="chips">${ib.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
  <div class="sub">Suggested: <b style="color:var(--txt)">${esc(ib.suggestion)}</b></div>
  ${ib.q?`<div class="qbox"><div class="qhead">✦ Executive assistant asks</div><div class="qtext">${ib.q.text}</div><div class="qrow">${ib.q.replies.map(r=>`<button class="qchip" onclick="answerQ('${t.id}','${r[1]}')">${esc(r[0])}</button>`).join("")}</div></div>`:""}
  <div class="irow"><button class="btn ok" onclick="decide('${t.id}',1)">✓ Approve & merge</button><button class="btn bad" onclick="decide('${t.id}',0)">✕ Reject & re-run</button><button class="btn" onclick="viewOnBoard('${t.id}')">View on board</button><button class="origbtn" onclick="var o=this.nextElementSibling;o.classList.toggle('open');this.textContent=o.classList.contains('open')?'Hide original ▲':'Show original ▼'">Show original ▼</button><div class="orig" id="orig-${t.id}"><div class="log mono" style="height:160px">${src.log.map(l=>`<div><span class="ts">${l[0]}</span> ${esc(l[1])}</div>`).join("")}</div></div></div></div>`}).join("")
 :`<div class="empty"><span class="big">✦</span>All clear — the interceptor handled everything so far.<br><span style="font-size:12.5px">Only orchestrator sessions that truly need you land here.</span></div>`}
function renderClosed(){const cs=S.tasks.filter(t=>t.closed),d=$("#closed"),o=d.open;d.innerHTML=`<summary>Closed sessions (${cs.length})</summary>`+(cs.map(t=>`<div class="cl"><span>${esc(t.title)} <span class="tag" style="color:var(--${t.result==="rejected"?"bad":"ok"})">${t.result==="rejected"?"rejected":"merged"}</span></span><button class="btn mini" onclick="reopen('${t.id}')">↺ Reopen</button></div>`).join("")||'<div style="color:var(--mut);font-size:12.5px;padding:6px 0">No closed sessions yet. Use “Close session” on a Done card.</div>');d.open=o}
function closeSess(id,e){e&&e.stopPropagation();const t=S.tasks.find(x=>x.id===id);t.closed=true;if(sel===id)closeSide();ev(`Closed session “${esc(t.title)}”`);save();render()}
function reopen(id){const t=S.tasks.find(x=>x.id===id);t.closed=false;ev(`Reopened “${esc(t.title)}”`);save();render()}
function card(t){const st=t.queued?'<span class="tag">queued</span>':t.col==="running"?'<span class="pulse"></span>':t.result==="rejected"?'<span class="tag" style="color:var(--bad)">rejected</span>':t.result==="approved"?'<span class="tag" style="color:var(--ok)">merged</span>':"";
 const par=t.kind==="worker"&&t.parent?S.tasks.find(x=>x.id===t.parent):null;
 return `<div class="card" draggable="true" data-id="${t.id}"><div class="row" style="justify-content:space-between"><span class="tag">${t.agent} · ${t.model}${t.kind==="worker"?" · worker":""}</span><span class="row">${t.touched?'<span class="tag" style="color:var(--acc2)" title="Interceptor touched this">✦</span>':""}${st}</span></div><div class="t" style="margin-top:7px">${esc(t.title)}</div>
 ${par?`<div class="mono" style="font-size:11px;color:var(--mut)">↳ ${esc(par.title)}</div>`:""}
 <div class="row mono" style="font-size:11px;color:var(--mut)">${esc(t.repo)} ⎇ ${esc(t.branch)}</div><div class="bar"><b style="width:${t.progress}%"></b></div>
 <div class="meta"><span>${Math.round(t.progress)}%</span><span>${fmtK(t.tokens)} tok · $${cost(t).toFixed(2)}</span><span>⏱ ${fmtT(t.elapsed)}</span></div>${t.col==="done"?`<button class="btn mini" style="margin-top:8px" onclick="closeSess('${t.id}',event)">Close session</button>`:""}</div>`}
function renderSide(){const t=S.tasks.find(x=>x.id===sel);if(!t){closeSide();return}const L=$("#side .log");const atBottom=!L||L.scrollTop+L.clientHeight>=L.scrollHeight-10;
 const add=t.diff.reduce((s,d)=>s+d.a,0),del=t.diff.reduce((s,d)=>s+d.d,0);
 $("#side").innerHTML=`<div class="hd"><div class="row" style="justify-content:space-between"><span class="tag">${t.queued?"Queued":COLS.find(c=>c[0]===t.col)[1]}</span><button class="btn" onclick="closeSide()">✕</button></div><h2 style="margin:10px 0 4px;font-size:18px">${esc(t.title)}</h2><div class="mono" style="font-size:12px;color:var(--mut)">${esc(t.repo)} ⎇ ${esc(t.branch)}</div></div>
 <div class="bd"><div class="kv"><div><span>Agent / model</span>${t.agent} · ${t.model}</div><div><span>Progress</span>${Math.round(t.progress)}%</div><div><span>Tokens · est. cost (sim)</span>${fmtK(t.tokens)} · $${cost(t).toFixed(3)}</div><div><span>Agent time</span>${fmtT(t.elapsed)}</div></div>
 ${t.desc?`<div class="sec">Instructions</div><div style="color:var(--mut)">${esc(t.desc)}</div>`:""}
 <div class="sec">Live agent log ${t.col==="running"?'<span class="pulse" style="display:inline-block;margin-left:6px"></span>':""}</div><div class="log mono">${t.log.map(l=>`<div><span class="ts">${l[0]}</span> ${esc(l[1])}</div>`).join("")||'<div class="ts">Agent not started yet.</div>'}</div>
 <div class="sec">Diff summary · <span class="add">+${add}</span> <span class="del">−${del}</span> · ${t.diff.length} files</div><div class="diff mono">${t.diff.map(d=>`<div><span>${d.f}</span><span><span class="add">+${d.a}</span> <span class="del">−${d.d}</span></span></div>`).join("")||'<div style="color:var(--mut)">No changes yet</div>'}</div>
 <div class="row" style="margin-top:18px;gap:8px">${t.col==="review"?`<button class="btn ok" onclick="decide('${t.id}',1)">✓ Approve & merge</button><button class="btn bad" onclick="decide('${t.id}',0)">✕ Reject & re-run</button>`:""}${t.queued?`<button class="btn p" onclick="startT('${t.id}')">▶ Start agent</button>`:""}${t.col==="running"&&!t.queued?`<button class="btn" onclick="pauseT('${t.id}')">⏸ Pause</button>`:""}${t.col==="done"?`<button class="btn" onclick="closeSess('${t.id}')">Close session</button>`:""}<div class="sp"></div><button class="btn bad" onclick="del('${t.id}')">Delete</button></div></div>`;
 const L2=$("#side .log");if(atBottom)L2.scrollTop=L2.scrollHeight}
function openSide(id){sel=id;renderSide();$("#side").classList.add("open")}
function closeSide(){sel=null;$("#side").classList.remove("open")}
function startT(id){const t=S.tasks.find(x=>x.id===id);t.queued=false;addLog(t,"▶ Agent "+t.agent+" started");ev(`<b>${t.agent}</b> started “${esc(t.title)}”`);save();render()}
function pauseT(id){const t=S.tasks.find(x=>x.id===id);t.queued=true;addLog(t,"⏸ Paused");save();render()}
function move(id,col){const t=S.tasks.find(x=>x.id===id);if(!t||t.col===col)return;t.queued=false;
 if(col==="running"){if(t.progress>=100){t.progress=0;t.diff=[]}addLog(t,"▶ Agent "+t.agent+" started");ev(`<b>${t.agent}</b> started “${esc(t.title)}”`)}
 if(col==="review"&&!t.inbox){t.progress=100;finish(t,true)}
 if(col==="done"){t.progress=100;t.result=t.result||"approved";t.doneAt=Date.now();if(!t.diff.length)finish(t,true)}

 if(col!=="done")t.result=null;if(!(col==="review"&&t.col==="done"))t.col=col;save();render()}
function answerQ(id,act){if(act==="approve")decide(id,1);else if(act==="reject")decide(id,0);else if(act==="board")viewOnBoard(id);else if(act==="orig"){const o=document.getElementById("orig-"+id);if(o){o.classList.add("open");o.scrollIntoView({block:"nearest"})}}}
function decide(id,ok){const t=S.tasks.find(x=>x.id===id);if(!t)return;
 const sub=t.inbox&&t.inbox.by&&t.inbox.by!==t.id?S.tasks.find(x=>x.id===t.inbox.by):null;
 if(ok){t.col="done";t.result="approved";t.doneAt=Date.now();addLog(t,"✓ Approved by reviewer — merged");if(sub){sub.col="done";sub.result="approved";sub.doneAt=Date.now();addLog(sub,"✓ Approved via inbox — merged")}ev(`Approved “${esc(t.title)}”`)}
 else{S.tasks.push({...JSON.parse(JSON.stringify(t)),id:uid(),col:"done",result:"rejected",doneAt:Date.now(),inbox:null});t.progress=0;t.diff=[];t.col="running";t.inbox=null;addLog(t,"✕ Rejected — re-running with reviewer feedback");if(sub){sub.progress=0;sub.diff=[];sub.col="running";addLog(sub,"✕ Rejected via inbox — re-running")}ev(`Rejected “${esc(t.title)}”, re-running`)}
 t.inbox=null;save();render()}
function del(id){S.tasks=S.tasks.filter(t=>t.id!==id);closeSide();save();render()}
function renderDash(){const T=S.tasks,done=T.filter(t=>t.col==="done"),ap=done.filter(t=>t.result==="approved");const tc=T.reduce((s,t)=>s+cost(t),0);
 const avg=done.length?done.reduce((s,t)=>s+t.elapsed,0)/done.length:0;
 $("#dash").innerHTML=`<div class="kpis">${[["Tasks done",ap.length],["Success rate",done.length?Math.round(ap.length/done.length*100)+"%":"—"],["Avg agent time",fmtT(avg)],["Total est. cost (sim)","$"+tc.toFixed(2)],["Tokens used",fmtK(T.reduce((s,t)=>s+t.tokens,0))],["Agents running",T.filter(t=>t.col==="running"&&!t.queued).length],["Intercepted ✦",S.intercepted||0],["Needs you",inboxItems().length]].map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div>
 <div class="grid2"><div class="panel"><h4>Throughput — tasks/hour (simulated, last 12h)</h4><canvas id="ch1" height="180" style="width:100%"></canvas></div><div class="panel"><h4>Cost by agent ($, sim)</h4><svg id="ch2" viewBox="0 0 400 180" style="width:100%;height:180px"></svg></div></div>
 <div class="grid2"><div class="panel"><h4>Agent utilization</h4>${AGENTS.map(a=>{const mine=T.filter(t=>t.agent===a.n),r=mine.filter(t=>t.col==="running").length;const u=Math.min(100,r*45+mine.length*8);return `<div class="util"><span class="nm">${a.n} <span style="color:var(--mut)">${a.m}</span></span><div class="bar"><b style="width:${u}%"></b></div><span class="mono">${u}%</span></div>`}).join("")}</div>
 <div class="panel"><h4>Activity feed</h4><div class="feed">${S.events.slice(0,8).map(e=>`<div>${e.h} · ${new Date(e.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>`).join("")||'<div>No activity yet — start an agent.</div>'}</div></div></div>`;
 const c=$("#ch1"),dpr=devicePixelRatio||1,w=c.clientWidth||500,h=180;c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
 const pts=Array.from({length:12},(_,i)=>{const now=Date.now(),hr=36e5;const real=done.filter(t=>t.doneAt>now-(12-i)*hr&&t.doneAt<=now-(11-i)*hr).length;return real+((i*7+3)%5)*.6+1});
 const mx=Math.max(...pts)*1.2;g.strokeStyle="#262a35";for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,20+i*45);g.lineTo(w,20+i*45);g.stroke()}
 const X=i=>10+i*(w-20)/11,Y=v=>h-15-v/mx*(h-30);const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#7c6cff55");gr.addColorStop(1,"#7c6cff00");
 g.beginPath();pts.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.lineTo(X(11),h);g.lineTo(X(0),h);g.fillStyle=gr;g.fill();
 g.beginPath();pts.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle="#7c6cff";g.lineWidth=2;g.stroke();
 const cs=AGENTS.map(a=>T.filter(t=>t.agent===a.n).reduce((s,t)=>s+cost(t),0)),cm=Math.max(...cs,.01),cols=["#7c6cff","#4fd1c5","#f5b84a","#3ecf8e"];
 $("#ch2").innerHTML=AGENTS.map((a,i)=>{const bh=cs[i]/cm*120;return `<rect x="${30+i*92}" y="${145-bh}" width="56" height="${bh}" rx="6" fill="${cols[i]}"/><text x="${58+i*92}" y="${138-bh}" fill="#e6e8ee" font-size="12" text-anchor="middle">$${cs[i].toFixed(2)}</text><text x="${58+i*92}" y="165" fill="#8a90a2" font-size="12" text-anchor="middle">${a.n}</text>`}).join("")}
// events
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".card");if(c){e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("drag")}});
document.addEventListener("dragend",e=>{e.target.classList?.remove("drag");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
document.addEventListener("dragover",e=>{const l=e.target.closest?.(".list");if(l){e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==l&&x.classList.remove("over"));l.classList.add("over")}});
document.addEventListener("drop",e=>{const l=e.target.closest?.(".list");if(l){e.preventDefault();move(e.dataTransfer.getData("text/plain"),l.dataset.col)}});
$("#board").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openSide(c.dataset.id)});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));const tab=b.dataset.tab;$("#dash").classList.toggle("on",tab==="dash");$("#inbox").classList.toggle("on",tab==="inbox");$("#brain").classList.toggle("on",tab==="brain");$("#board").style.display=tab==="board"?"grid":"none";$("#closed").style.display=tab==="board"?"block":"none";if(tab==="inbox")openInbox();if(tab==="brain")renderBrain();render()});
$("#form [name=agent]").innerHTML=AGENTS.map((a,i)=>`<option value="${i}">${a.n} — ${a.m}</option>`).join("");
$("#new").onclick=()=>{$("#modal").classList.add("open");$("#form [name=title]").focus()};$("#cancel").onclick=()=>$("#modal").classList.remove("open");
$("#form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const t=mk(f.get("title"),+f.get("agent"),"backlog",f.get("repo")||"acme/web-app",f.get("desc"));if(f.get("branch"))t.branch=f.get("branch");S.tasks.unshift(t);ev(`Created “${esc(t.title)}”`);if(f.get("start"))startT(t.id);e.target.reset();$("#modal").classList.remove("open");save();render()};
$("#reset").onclick=()=>{if(confirm("Reset demo data?")){closeSide();seed();render()}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSide();$("#modal").classList.remove("open")}if(e.key==="n"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#new").click()}});
load();S.tasks.forEach(t=>{if(t.result&&t.col!=="done")t.col="done"});render();const h=location.hash;if(h==="#board")document.querySelector('.tabs button[data-tab="board"]').click();else if(h==="#dashboard")document.querySelector('.tabs button[data-tab="dash"]').click();else if(h==="#brain")document.querySelector('.tabs button[data-tab="brain"]').click();else document.querySelector('.tabs button[data-tab="inbox"]').click();setInterval(loop,1000);
</script></body></html>
